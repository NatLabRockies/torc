        workflow_id:
          type: integer
          format: int64
    ExecutionConfig:
      type: object
      description: |-
        Unified execution configuration that controls how jobs are run.

        Used both as the user-authored `WorkflowSpec.execution_config` and as the
        persisted `WorkflowModel.execution_config` (stored as JSON in the
        `workflow.execution_config` column).
      properties:
        enable_cpu_bind:
          type:
          - boolean
          - 'null'
          description: When true, allow Slurm to bind tasks to specific CPU cores (slurm mode only).
        job_stdio_overrides:
          type:
          - object
          - 'null'
          description: |-
            Per-job stdio overrides keyed by job name.
            Populated during workflow creation from per-job `stdio` fields in the spec.
          additionalProperties:
            $ref: '#/components/schemas/StdioConfig'
          propertyNames:
            type: string
        limit_resources:
          type:
          - boolean
          - 'null'
          description: |-
            When true (default), monitor memory/CPU usage and kill jobs that exceed
            their resource requirements (OOM enforcement). Only applies in direct mode.
        mode:
          $ref: '#/components/schemas/ExecutionMode'
          description: 'Execution mode: direct (default), slurm, or auto.'
        oom_exit_code:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Exit code to use when a job is OOM-killed (direct mode only).
            Default: 137 (128 + SIGKILL = 128 + 9).
        sigkill_headroom_seconds:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Seconds before end_time to send SIGKILL (direct mode) or set srun --time (slurm mode).
            Default: 60.
        sigterm_lead_seconds:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Seconds before SIGKILL to send the termination signal (direct mode only).
            Default: 30.
        srun_mpi:
          type:
          - string
          - 'null'
          description: MPI launcher mode for the outer `srun` used to launch one job runner per allocated node.
        srun_termination_signal:
          type:
          - string
          - 'null'
          description: Signal specification for srun steps, passed as `srun --signal=<value>` (slurm mode only).
        staggered_start:
          type:
          - boolean
          - 'null'
          description: Enable staggered startup for job runners to mitigate thundering herd.
        stdio:
          $ref: '#/components/schemas/StdioConfig'
          description: Workflow-level default for stdout/stderr capture.
        termination_signal:
          type:
          - string
          - 'null'
          description: |-
            Signal to send before SIGKILL for graceful termination (direct mode only).
            Default: "SIGTERM".
        timeout_exit_code:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Exit code to use when a job times out.
            Default: 152 (matches Slurm's TIMEOUT exit code).
      additionalProperties: false
    ExecutionMode:
      type: string
      description: |-
        Execution mode for job processes.

        Controls how torc manages job processes during execution, particularly
        around termination and resource enforcement.
      enum:
      - direct
      - slurm
      - auto
