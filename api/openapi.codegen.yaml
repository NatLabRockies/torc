      properties:
        user_data:
          type: array
          items:
            $ref: '#/components/schemas/UserDataModel'
    UserDataModel:
      type: object
      required:
      - workflow_id
      - name
      properties:
        data: {}
        id:
          type:
          - integer
          - 'null'
          format: int64
        is_ephemeral:
          type:
          - boolean
          - 'null'
        name:
          type: string
        workflow_id:
          type: integer
          format: int64
    UserGroupMembershipModel:
      type: object
      required:
      - user_name
      - group_id
      - role
      properties:
        created_at:
          type:
          - string
          - 'null'
        group_id:
          type: integer
          format: int64
        id:
          type:
          - integer
          - 'null'
          format: int64
        role:
          type: string
        user_name:
          type: string
    VersionResponse:
      type: object
      required:
      - version
      - api_version
      properties:
        api_version:
          type: string
        git_hash:
          type:
          - string
          - 'null'
        version:
          type: string
    WorkflowAccessGroupModel:
      type: object
      required:
      - workflow_id
      - group_id
      properties:
        created_at:
          type:
          - string
          - 'null'
        group_id:
          type: integer
          format: int64
        workflow_id:
          type: integer
          format: int64
    WorkflowActionModel:
      type: object
      required:
      - workflow_id
      - trigger_type
      - action_type
      - action_config
      properties:
        action_config: {}
        action_type:
          type: string
        executed:
          type: boolean
          default: false
        executed_at:
          type:
          - string
          - 'null'
        executed_by:
          type:
          - integer
          - 'null'
          format: int64
        id:
          type:
          - integer
          - 'null'
          format: int64
        is_recovery:
          type: boolean
          default: false
        job_ids:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int64
        persistent:
          type: boolean
          default: false
        required_triggers:
          type: integer
          format: int64
          default: 1
        trigger_count:
          type: integer
          format: int64
          default: 0
        trigger_type:
          type: string
        workflow_id:
          type: integer
          format: int64
    WorkflowModel:
      type: object
      required:
      - name
      - user
      properties:
        access_groups:
          type:
          - array
          - 'null'
          items:
            type: string
          description: |-
            Access group names granted shared access to this workflow.
            Projection of the `workflow_access_group` join table (which remains the
            source of truth). On create, names are resolved to group IDs and join
            rows are inserted in the same transaction as the workflow row; an
            unknown name fails the whole create. On read, populated from the join
            table. Use `add_workflow_to_group` / `remove_workflow_from_group` for
            post-creation changes.
        compute_node_expiration_buffer_seconds:
          type:
          - integer
          - 'null'
          format: int64
        compute_node_ignore_workflow_completion:
          type:
          - boolean
          - 'null'
        compute_node_min_time_for_new_jobs_seconds:
          type:
          - integer
          - 'null'
          format: int64
        compute_node_wait_for_healthy_database_minutes:
          type:
          - integer
          - 'null'
          format: int64
        compute_node_wait_for_new_jobs_seconds:
          type:
          - integer
          - 'null'
          format: int64
        description:
          type:
          - string
          - 'null'
        dynamic_jobs:
          $ref: '#/components/schemas/DynamicJobsConfig'
          description: |-
            Dynamic job spawning configuration. Mirrors the workflow-spec
            `dynamic_jobs` section identically. Runtime-immutable after
            workflow creation.
        enable_ro_crate:
          type:
          - boolean
          - 'null'
        env:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          propertyNames:
            type: string
            pattern: ^[A-Za-z_][A-Za-z0-9_]*$
        execution_config:
          $ref: '#/components/schemas/ExecutionConfig'
        id:
          type:
          - integer
          - 'null'
          format: int64
        is_archived:
          type:
          - boolean
          - 'null'
          description: |-
            True when the workflow has been archived.
            Read-only on the API: set via `POST /workflows/{id}/archive`,
            cleared via `POST /workflows/{id}/reset_status`. Values supplied to
            create/update workflow endpoints are ignored.
          readOnly: true
        is_canceled:
          type:
          - boolean
          - 'null'
          description: |-
            True when a user (or scheduler) has canceled the workflow.
            Read-only on the API: set via `POST /workflows/{id}/cancel`,
            cleared via `POST /workflows/{id}/reset_status`. Values supplied to
            create/update workflow endpoints are ignored.
          readOnly: true
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: {}
          propertyNames:
            type: string
        name:
          type: string
        project:
          type:
          - string
          - 'null'
        resource_monitor_config:
          $ref: '#/components/schemas/ResourceMonitorConfig'
        run_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Current run number; incremented on each restart/recovery.
            Read-only on the API: incremented as a side effect of
            `POST /workflows/{id}/reset_status`. Values supplied to
            create/update workflow endpoints are ignored.
          readOnly: true
        slurm_defaults:
          type:
          - object
          - 'null'
          additionalProperties: {}
          propertyNames:
            type: string
        submission_directory:
          type:
          - string
          - 'null'
          description: |-
            Absolute directory the workflow was originally submitted from
            (captured at `torc create` / `torc run` / `torc submit` time). Exposed
            to jobs as `TORC_WORKFLOW_SUBMISSION_DIR` so user code with relative
            paths can resolve against the original CWD even when run on a compute
            node. Set once at workflow creation and not overwritten by later
            `schedule-nodes`/`watch` invocations.
        timestamp:
          type:
          - string
          - 'null'
        use_pending_failed:
          type:
          - boolean
          - 'null'
        user:
          type: string
    WorkflowStatusResponse:
      type: object
      description: Aggregated status summary for a workflow, computed server-side.
      required:
      - workflow_id
      - workflow_name
      - workflow_user
      - total_jobs
      - jobs_by_status
      - total_exec_time_minutes
      - active_compute_nodes
      - pending_scheduled_nodes
      - active_scheduled_nodes
      - is_complete
      - is_canceled
      - runtime_blocked_ready_jobs
      properties:
        active_compute_nodes:
          type: integer
          format: int64
        active_scheduled_nodes:
          type: integer
          format: int64
        is_canceled:
          type: boolean
        is_complete:
          type: boolean
        jobs_by_status:
          $ref: '#/components/schemas/JobStatusCounts'
        longest_ready_runtime_seconds:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Longest required runtime (seconds) among ready jobs. Only populated when
            some ready jobs are runtime-blocked.
        max_allocation_remaining_seconds:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Greatest remaining walltime (seconds) across active walltime-bounded
            allocations. None when no active allocation reports an end time.
        pending_scheduled_nodes:
          type: integer
          format: int64
        runtime_blocked_ready_jobs:
          type: integer
          format: int64
          description: |-
            Ready jobs whose required runtime exceeds the remaining walltime of every
            active allocation, so they cannot start until a fresh allocation appears.
            0 when there are no walltime-bounded allocations. See `torc workflows diagnose`.
        total_exec_time_minutes:
          type: number
          format: double
        total_jobs:
          type: integer
          format: int64
        walltime_seconds:
          type:
          - number
          - 'null'
          format: double
        workflow_id:
          type: integer
          format: int64
        workflow_name:
          type: string
        workflow_user:
          type: string
