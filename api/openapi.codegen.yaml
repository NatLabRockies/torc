          type:
          - string
          - 'null'
        id:
          type:
          - integer
          - 'null'
          format: int64
        name:
          type: string
    ActiveTaskResponse:
      type: object
      description: |-
        Wrapper for `GET /workflows/{id}/active_task` so the response always has a JSON body,
        even when the workflow currently has no active async task. The `task` field is the
        active task for this workflow, or null if none is in-flight.
      properties:
        task:
          $ref: '#/components/schemas/TaskModel'
    AdminAuditLogEntry:
      type: object
      description: |-
        One row of the admin raw-SQL audit log (`admin_audit_log`), returned by
        `GET /admin/audit-log` (`torc admin list-audit-log`).
      required:
      - id
      - user_name
      - timestamp
      - sql_text
      - is_write
      - allow_full_table
      - committed
      - success
      properties:
        allow_full_table:
          type: boolean
          description: True when the full-table guard was overridden for this statement.
        committed:
          type: boolean
          description: True when the write was committed to the database.
        error:
          type:
          - string
          - 'null'
          description: Error message captured for a failed statement, when applicable.
        id:
          type: integer
          format: int64
          description: Auto-increment row id.
        is_write:
          type: boolean
          description: True for write-path statements (all audited rows are writes).
        rows_affected:
          type:
          - integer
          - 'null'
          format: int64
          description: Rows affected by the statement, when known.
        sql_text:
          type: string
          description: The SQL statement text.
        success:
          type: boolean
          description: True when the statement executed without error.
        timestamp:
          type: integer
          format: int64
          description: Execution time in milliseconds since the Unix epoch.
        user_name:
          type: string
          description: User that executed the statement.
    AdminSqlRequest:
      type: object
      description: Request body for the admin raw-SQL endpoint (`POST /admin/sql`).
      required:
      - sql
      properties:
        allow_full_table:
          type: boolean
          description: |-
            Permit an unqualified UPDATE/DELETE (no WHERE clause). Ignored on the
            read-only path.
        dry_run:
          type: boolean
          description: |-
            Write path only: run inside a transaction, report rows affected, then
            roll back instead of committing (preview).
        limit:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Maximum number of SELECT result rows to return. Defaults to and is capped
            at 100,000 (the server-wide list cap); values above the cap are clamped.
        sql:
          type: string
          description: The single SQL statement to execute.
        write:
          type: boolean
          description: |-
            Opt into the write path. When false (default) the statement runs on a
            read-only connection, so any write fails at the SQLite layer.
    AdminSqlResponse:
      type: object
      description: Response body for the admin raw-SQL endpoint (`POST /admin/sql`).
      required:
      - columns
      - items
      - committed
      properties:
        columns:
          type: array
          items:
            type: string
          description: |-
            Column names in result order, defining how `items` is displayed (empty for
            write statements). Names the query repeats are suffixed (`id`, `id_2`, ...)
            so each item's keys stay unique.
        committed:
          type: boolean
          description: True when a write was committed to the database.
        items:
          type: array
          items:
            type: object
            additionalProperties: {}
            propertyNames:
              type: string
          description: Result rows as objects keyed by `columns` (empty for write statements).
        rows_affected:
          type:
          - integer
          - 'null'
          format: int64
          description: Number of rows affected by a write statement, when applicable.
    ArchiveWorkflowRequest:
      type: object
      description: |-
