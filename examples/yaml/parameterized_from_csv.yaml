# Table-Based Parameterization from a CSV File
# Instead of declaring independent parameter axes and taking their Cartesian
# product, `parameters_file` supplies the exact set of combinations as a table:
# each row of the CSV becomes one job, and its columns become substitution
# tokens ({model}, {lr}, {batch_size}, {dataset}).
#
# This is ideal when the combinations are irregular (not a full grid) or are
# generated by another tool. See examples/parameter_tables/sweep.csv for the table.
#
# Run from the repository root (the path is resolved relative to the current
# working directory, like the `@file` list syntax):
#   torc create examples/yaml/parameterized_from_csv.yaml
#
# `parameters_file` is mutually exclusive with `parameters`, `parameter_mode`,
# and `use_parameters`.

name: parameterized_from_csv
description: Train one model per row of a CSV sweep table

jobs:
  # One job per CSV row (4 rows -> 4 jobs). CSV cells are inferred as
  # integer -> float -> string, so {batch_size} is an int and {lr} a float.
  - name: train_{model}_{dataset}_bs{batch_size}
    command: echo "training {model} on {dataset} lr={lr} batch_size={batch_size}"
    resource_requirements: minimal
    parameters_file: examples/parameter_tables/sweep.csv

resource_requirements:
  - name: minimal
    num_cpus: 1
    num_gpus: 0
    num_nodes: 1
    memory: 1g
    runtime: PT5M

files:
  - name: train_{model}_{dataset}_bs{batch_size}
    path: train_{model}_{dataset}_bs{batch_size}.dat
    parameters_file: examples/parameter_tables/sweep.csv
