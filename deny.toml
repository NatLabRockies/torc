# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

# Vulnerability scanning via RustSec advisory database
[advisories]
ignore = [
    # Transitive deps we can't directly upgrade
    { id = "RUSTSEC-2025-0069", reason = "daemonize - no alternative available yet" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash via tracing-timing - needs upstream update" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 via tabled and validator - no safe upgrade available yet" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml O(N²) DoS via plist/service-manager - no upstream upgrade available" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml NsReader heap DoS via plist/service-manager - no upstream upgrade available" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml via serde_yaml - unmaintained, no safe upgrade; replace serde_yaml separately" },
    { id = "RUSTSEC-2026-0367", reason = "zip 7.x build-dep of plotly_kaleido (extracts kaleido binary at build time); fix requires zip 9, no upstream upgrade available" },
    { id = "RUSTSEC-2026-0368", reason = "zip 7.x build-dep of plotly_kaleido; fix requires zip 9, no upstream upgrade available" },
    { id = "RUSTSEC-2026-0369", reason = "zip 7.x build-dep of plotly_kaleido; fix requires zip 9, no upstream upgrade available" },
    { id = "RUSTSEC-2026-0374", reason = "basic-toml via askama_derive (proc-macro, compile-time only) via plotly; latest askama_derive still requires it, no upstream upgrade available" },
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 via zip 7.x build-dep of plotly_kaleido; fix requires zstd 0.14, no upstream upgrade available" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7.x via zip 7.x build-dep of plotly_kaleido; fix requires zstd-safe 8.2, no upstream upgrade available" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7.x via zip 7.x build-dep of plotly_kaleido; fix requires zstd-safe 8.2, no upstream upgrade available" },
]

# License compliance - permissive allow-list
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

# cargo-husky has no license field in Cargo.toml but is MIT on GitHub
[[licenses.clarify]]
crate = "cargo-husky"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true

# Crate bans and duplicate detection
[bans]
multiple-versions = "warn"
wildcards = "deny"

# Source origin restrictions
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
