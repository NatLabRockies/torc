name: "GPU Pipeline Perf Test (3K Jobs)"
description: |
  Stress-test the runner-server interaction hot path with a three-stage GPU
  pipeline:

    setup_{i}    (CPU)  ──▶  gpu_{i}    (1 GPU)  ──▶  post_{i}    (CPU)
                                                       │
                                                       ▼
                                                  final_aggregate

  - 1,000 setup jobs (CPU only) each produce one input file.
  - 1,000 GPU jobs each consume the matching setup file, run on 1 GPU,
    and emit a result file. GPU jobs delete their input file on the way
    through.
  - 1,000 postprocess jobs (1 CPU each) each consume one GPU output and
    emit a tiny result stub. Postprocess jobs delete their GPU input on
    the way through.
  - 1 final_aggregate job fans in over all postprocess outputs.

  Total: 3,001 jobs, 3,000 file dependencies plus a regex fan-in.

  ## Designed scheduling shape

  Priorities (higher = claimed first):
    - gpu_*           : 100  (always preferred when a GPU is free)
    - post_*          :  50  (drains finished GPU outputs as fast as possible)
    - setup_*         :   1  (only fills CPUs that have no postprocess work)
    - final_aggregate :   0

  In steady state this produces roughly:
    setup files created and consumed continuously by GPU jobs,
    GPU jobs running flat-out limited by GPU count,
    postprocess jobs filling whatever CPU capacity isn't taken by setups.

  The only files that accumulate end-to-end are the postprocess output stubs,
  which the final aggregator consumes in one pass.

  ## What this exercises

  Compared to running on `main`, this workflow specifically stresses the
  runner-server hot path that recent perf changes target:

  1. Empty-poll cost while runners with free CPU capacity wait for upstream
     GPU jobs to finish (lock-free pre-check).
  2. Per-iteration sleep gap between short jobs completing and the next
     batch being claimed (skip-sleep-on-completions).
  3. Per-job round-trip cost for completion reporting at high throughput
     (batch_complete_jobs).

  ## Running

  Build and start the server:

      cargo build --release --features server-bin --bin torc-server
      ./target/release/torc-server run

  Submit the workflow (creates jobs and triggers the on_workflow_start action
  so Slurm allocates the GPU node block):

      torc submit tests/workflows/gpu_pipeline_perf_test/workflow.yaml

  Or create now and submit later:

      torc create tests/workflows/gpu_pipeline_perf_test/workflow.yaml
      torc submit <workflow_id>

  Replace the `account` field below with your Slurm account before running.

slurm_schedulers:
  - name: "debug_gpu"
    account: "PLACEHOLDER_ACCOUNT"
    partition: "debug-gpu"
    nodes: 2
    walltime: "08:00:00"

resource_requirements:
  - name: "cpu_small"
    num_cpus: 1
    num_gpus: 0
    num_nodes: 1
    memory: "256m"
    runtime: "PT1M"

  - name: "one_gpu"
    num_cpus: 1
    num_gpus: 1
    num_nodes: 1
    memory: "256m"
    runtime: "PT1M"

files:
  - name: "setup_out_{i:04d}"
    path: "output/setup/setup_out_{i:04d}.txt"
    parameters:
      i: "0:999"

  - name: "gpu_out_{i:04d}"
    path: "output/gpu/gpu_out_{i:04d}.txt"
    parameters:
      i: "0:999"

  - name: "post_out_{i:04d}"
    path: "output/post/post_out_{i:04d}.txt"
    parameters:
      i: "0:999"

  - name: "final_report"
    path: "output/final_report.txt"

jobs:
  # 1k setup jobs — CPU only, lowest priority. Each emits one file.
  - name: "setup_{i:04d}"
    command: |
      mkdir -p output/setup
      printf 'setup-%s\n' "{i}" > output/setup/setup_out_{i:04d}.txt
    priority: 1
    resource_requirements: "cpu_small"
    scheduler: "debug_gpu"
    output_files: ["setup_out_{i:04d}"]
    parameters:
      i: "0:999"

  # 1k GPU jobs — 1 GPU each, highest priority. Consume setup file,
  # produce gpu output, delete the setup file on the way through.
  - name: "gpu_{i:04d}"
    command: |
      mkdir -p output/gpu
      cat output/setup/setup_out_{i:04d}.txt > output/gpu/gpu_out_{i:04d}.txt
      rm -f output/setup/setup_out_{i:04d}.txt
    priority: 100
    resource_requirements: "one_gpu"
    scheduler: "debug_gpu"
    input_files: ["setup_out_{i:04d}"]
    output_files: ["gpu_out_{i:04d}"]
    parameters:
      i: "0:999"

  # 1k postprocess jobs — CPU only, second-highest priority so finished
  # GPU outputs drain before new setup files are created.
  - name: "post_{i:04d}"
    command: |
      mkdir -p output/post
      cat output/gpu/gpu_out_{i:04d}.txt > output/post/post_out_{i:04d}.txt
      rm -f output/gpu/gpu_out_{i:04d}.txt
    priority: 50
    resource_requirements: "cpu_small"
    scheduler: "debug_gpu"
    input_files: ["gpu_out_{i:04d}"]
    output_files: ["post_out_{i:04d}"]
    parameters:
      i: "0:999"

  # Single fan-in over all 1k postprocess outputs.
  - name: "final_aggregate"
    command: |
      mkdir -p output
      count=$(ls output/post 2>/dev/null | wc -l)
      printf 'postprocess_outputs=%s\n' "$count" > output/final_report.txt
      printf 'completed_at=%s\n' "$(date -Iseconds)" >> output/final_report.txt
    priority: 0
    resource_requirements: "cpu_small"
    scheduler: "debug_gpu"
    input_file_regexes: ["^post_out_\\d+$"]
    output_files: ["final_report"]

actions:
  - trigger_type: "on_workflow_start"
    action_type: "schedule_nodes"
    scheduler: "debug_gpu"
    scheduler_type: "slurm"
    num_allocations: 1
    start_one_worker_per_node: true
