name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.4.52'

      - name: Install mdbook-mermaid
        run: cargo install mdbook-mermaid@0.16.0

      - name: Build documentation
        run: |
          cd docs
          # Override site-url for versioned path
          sed -i 's|site-url = "/torc/"|site-url = "/torc/latest/"|' book.toml
          mdbook build

      - name: Deploy to gh-pages
        run: |
          set -e

          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone gh-pages branch (shallow)
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            gh-pages-deploy 2>/dev/null || {
            # Branch doesn't exist yet — create it
            mkdir gh-pages-deploy
            cd gh-pages-deploy
            git init
            git checkout -b gh-pages
            git remote add origin \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            cd ..
          }

          cd gh-pages-deploy

          # One-time: clean legacy Sphinx content
          rm -rf _static _sources _images genindex.html objects.inv searchindex.js \
                 py-modindex.html search.html .buildinfo

          # Replace latest/ with new build
          rm -rf latest
          cp -r ../docs/book latest

          # Ensure root files exist
          touch .nojekyll

          # Root redirect
          cp ../docs/redirect.html index.html

          # Initialize versions.json if it doesn't exist
          if [ ! -f versions.json ]; then
            cat > versions.json << 'VJSON'
          {
            "latest_release": null,
            "versions": [
              {"version": "latest", "label": "latest (dev)", "path": "/torc/latest/"}
            ]
          }
          VJSON
          fi

          # Commit and push (no-op if no changes)
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy docs from ${GITHUB_SHA::8}"
            git push origin gh-pages
          fi
