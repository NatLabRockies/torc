name: Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Run weekly to catch newly published advisories
  schedule:
    - cron: '0 6 * * 1'

jobs:
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # No --config: the action appends command-arguments after `check`, and
          # cargo-deny only accepts --config as a global flag. ./deny.toml is the
          # default config path, so passing it was redundant anyway.
          command: check
