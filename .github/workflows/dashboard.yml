name: Desktop

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Torc Desktop (torc-desktop)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: torc-desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            torc-desktop/src-tauri/target
          key: ${{ runner.os }}-desktop-check-${{ hashFiles('torc-desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-check-

      - name: Check Rust formatting
        working-directory: torc-desktop/src-tauri
        run: cargo fmt -- --check

      - name: Run Clippy
        working-directory: torc-desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        working-directory: torc-desktop/src-tauri
        run: cargo test
