name: Desktop

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Torc Desktop (torc-desktop)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: torc-desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: torc-desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            torc-desktop/src-tauri/target
          key: ${{ runner.os }}-desktop-check-${{ hashFiles('torc-desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-check-

      - name: Install npm packages
        run: npm ci

      - name: Type-check the connect page
        run: npm run check

      # The Rust build embeds the connect page from dist/.
      - name: Build the connect page
        run: npm run build

      - name: Check Rust formatting
        working-directory: torc-desktop/src-tauri
        run: cargo fmt -- --check

      - name: Run Clippy
        working-directory: torc-desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        working-directory: torc-desktop/src-tauri
        run: cargo test
