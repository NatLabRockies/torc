# Nextest configuration.
#
# nextest runs every test in its own process, so in-process state (env vars, `#[serial]`, and
# `#[once]` fixtures such as `start_server`) is never shared between tests: each test gets its
# own server and temp database. Tests therefore run fully in parallel. The one piece of
# cross-process state, the fake Slurm scripts' job files, is isolated per process via
# `fake_slurm_state_dir()` in tests/common.rs. Before adding a test group here, make sure the
# tests really share state across processes (fixed paths, fixed ports, the repo directory).

experimental = ["setup-scripts"]

# Build the torc/torc-server/etc. binaries once before any test runs, instead of every test
# process invoking `cargo build` and contending on the cargo lock. Unix only (shell script);
# on Windows tests fall back to building themselves.
[scripts.setup.build-binaries]
command = 'tests/scripts/nextest_build_binaries.sh'
slow-timeout = { period = "300s" }

[[profile.default.scripts]]
platform = { host = 'cfg(unix)' }
filter = 'all()'
setup = 'build-binaries'

[profile.default]
# Generous ceiling for heavy end-to-end tests on loaded CI runners (and for the first test on
# Windows, which still builds the binaries itself).
slow-timeout = { period = "120s", terminate-after = 3 }

# Race-condition tests: reserve the entire test runner so the machine is as idle
# as possible while they run. Each spawns many OS threads to provoke genuine
# claim/complete contention; if other test binaries steal CPU, the OS can
# serialize those threads and mask a race (a false negative).
# threads-required = "num-test-threads" makes nextest run each of these alone.
# (Only the internally-multithreaded tests need this; the deterministic
# test_two_runners_complete_same_job_rejected does not depend on timing.)
[[profile.default.overrides]]
filter = 'test(=test_concurrent_claim_and_complete) | test(=test_prepare_next_jobs_concurrent_allocation) | test(=test_prepare_next_jobs_concurrent_small_batches)'
threads-required = 'num-test-threads'
