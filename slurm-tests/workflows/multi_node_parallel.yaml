# Test: Multi-Node Parallel CPU Stress
#
# 2-node allocation with start_one_worker_per_node=true, 5 parallel jobs.
# Each job uses stress-ng to exercise 5 CPUs for 30 seconds.
# Verifies that all 5 jobs get full CPU access across 2 nodes.

name: multi_node_parallel
description: 2-node allocation with one worker per node — 5 jobs x 5 CPUs via stress-ng
project: slurm-tests

resource_monitor:
  enabled: true
  granularity: time_series
  sample_interval_seconds: 2

resource_requirements:
  - name: work_resources
    num_cpus: 5
    num_nodes: 1
    memory: 2g
    runtime: PT10M

jobs:
  - name: stress_{i}
    command: stress-ng --cpu 5 --timeout 30 --metrics-brief
    resource_requirements: work_resources
    scheduler: two_node_scheduler
    parameters:
      i: 1:5

slurm_schedulers:
  - name: two_node_scheduler
    account: PLACEHOLDER_ACCOUNT
    partition: PLACEHOLDER_PARTITION
    nodes: 2
    walltime: "00:30:00"

actions:
  - trigger_type: "on_workflow_start"
    action_type: "schedule_nodes"
    scheduler: "two_node_scheduler"
    scheduler_type: "slurm"
    num_allocations: 1
    start_one_worker_per_node: true
