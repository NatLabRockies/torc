# Test 3: Multi-Node Single Worker
#
# 2-node allocation with start_one_worker_per_node=false (default), 4 parallel jobs.
# Verifies only 1 worker runs — all jobs execute on the same node sequentially.
# Contrast with Test 2 to prove the flag matters.

name: multi_node_single_worker
description: 2-node allocation with single worker (default) — jobs run on one node
project: slurm-tests

resource_requirements:
  - name: work_resources
    num_cpus: 1
    num_nodes: 1
    memory: 512m
    runtime: PT5M

jobs:
  - name: work_{i}
    command: |
      echo "Job {i} on $(hostname) at $(date +%T)"
      sleep 3
      echo "Job {i} done on $(hostname) at $(date +%T)"
    resource_requirements: work_resources
    scheduler: two_node_scheduler
    parameters:
      i: 1:4

slurm_schedulers:
  - name: two_node_scheduler
    account: PLACEHOLDER_ACCOUNT
    partition: PLACEHOLDER_PARTITION
    nodes: 2
    walltime: "00:15:00"

actions:
  - trigger_type: "on_workflow_start"
    action_type: "schedule_nodes"
    scheduler: "two_node_scheduler"
    scheduler_type: "slurm"
    num_allocations: 1
